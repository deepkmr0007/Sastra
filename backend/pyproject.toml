[project]
name = "sastra"
version = "1.0.0"
description = "SASTRA — secure personal AI workspace (server + worker)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S"]
ignore = ["E731", "S101", "S311", "B008", "S603", "S607", "S310", "S608", "S108", "B904", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B108", "B311", "B404", "B603", "B607", "B310", "B608"]
