name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check --output-format=github sastra tests
      - name: Security scan (code)
        run: bandit -q -ll -r sastra -c pyproject.toml -f custom --msg-template "::error file={relpath},line={line}::{test_id} {msg}"
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Tests (includes adversarial prompt-injection and sandbox tests)
        run: python -W ignore::ResourceWarning -m unittest discover -s tests -t . -v

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Android lint
        run: ./gradlew lintDebug --no-daemon
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: sastra-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: android/app/build/reports/

  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -t sastra:ci -f deploy/Dockerfile .
      - name: Container smoke test
        run: |
          set +e
          out=$(docker run -d --name sastra-smoke -e SASTRA_JWT_SECRET=ci-secret-ci-secret-ci-secret-1234 -p 8787:8787 sastra:ci 2>&1)
          if [ $? -ne 0 ]; then echo "::error::docker run failed: $(echo "$out" | tr '\n' ' ')"; docker images | head; exit 1; fi
          for i in $(seq 1 40); do curl -fs localhost:8787/health && break; sleep 1; done
          if ! curl -fs localhost:8787/health; then
            echo "::error::health check failed: $(docker logs sastra-smoke 2>&1 | tail -20 | tr '\n' ' ')"; exit 1
          fi
          docker logs sastra-smoke 2>&1 | grep -q "setup code" || { echo "::error::no setup code in logs"; exit 1; }
