# Egress allowlist for sandbox dependency installs. Everything else is denied.
http_port 3128
acl allowed dstdomain .pypi.org .pythonhosted.org .npmjs.org registry.npmjs.org
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny CONNECT !SSL_ports
http_access allow allowed
http_access deny all
cache deny all
access_log stdio:/dev/stdout
